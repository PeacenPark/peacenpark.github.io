<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2b5596">
<title>로그인 - 전기(공사) 계산기</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --primary-color:#4a90e2; --hover-color:#3a7bd5;
    --light-bg:#ebf5ff; --card-bg:#1e3a5f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--light-bg); font-family:'Segoe UI','Noto Sans KR',sans-serif; padding:20px;
  }
  .card{
    width:100%; max-width:400px; background:#fff; border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.12); padding:32px 28px;
  }
  .card h1{ font-size:20px; margin:0 0 4px; color:#1e3a5f; text-align:center; }
  .card p.sub{ margin:0 0 24px; text-align:center; color:#777; font-size:13px; }
  .tabs{ display:flex; margin-bottom:20px; border-bottom:1px solid #eee; }
  .tab{
    flex:1; text-align:center; padding:10px 0; cursor:pointer; color:#999;
    font-weight:600; font-size:14px; border-bottom:2px solid transparent;
  }
  .tab.active{ color:var(--primary-color); border-color:var(--primary-color); }
  form{ display:none; flex-direction:column; gap:12px; }
  form.active{ display:flex; }
  input{
    padding:12px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; width:100%;
  }
  input:focus{ outline:none; border-color:var(--primary-color); }
  button{
    padding:12px 14px; border:none; border-radius:8px; font-size:14px; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  .btn-primary{ background:var(--primary-color); color:#fff; }
  .btn-primary:hover{ background:var(--hover-color); }
  .btn-google{
    background:#fff; color:#444; border:1px solid #ddd; display:flex; align-items:center;
    justify-content:center; gap:8px;
  }
  .btn-google:hover{ background:#f7f7f7; }
  .divider{ text-align:center; color:#aaa; font-size:12px; margin:16px 0; position:relative; }
  .divider::before, .divider::after{
    content:""; position:absolute; top:50%; width:42%; height:1px; background:#eee;
  }
  .divider::before{ left:0; } .divider::after{ right:0; }
  #msg{ margin-top:14px; font-size:13px; text-align:center; min-height:18px; }
  #msg.error{ color:#d9534f; } #msg.info{ color:#2b5596; }
  .status-box{ display:none; text-align:center; }
  .status-box.active{ display:block; }
  .status-box .icon{ font-size:40px; margin-bottom:12px; }
  .status-box h2{ font-size:17px; color:#1e3a5f; margin:0 0 8px; }
  .status-box p{ font-size:13px; color:#777; line-height:1.6; margin:0 0 20px; }
  .btn-logout{ background:#eee; color:#555; }
</style>
</head>
<body>
  <div class="card">

    <!-- 로그인/회원가입 폼 -->
    <div id="authView">
      <h1>전기(공사) 계산기</h1>
      <p class="sub">승인된 사용자만 이용할 수 있습니다</p>

      <div class="tabs">
        <div class="tab active" data-tab="login">로그인</div>
        <div class="tab" data-tab="signup">회원가입</div>
      </div>

      <form id="loginForm" class="active">
        <input type="email" id="loginEmail" placeholder="이메일" required autocomplete="email">
        <input type="password" id="loginPw" placeholder="비밀번호" required autocomplete="current-password">
        <button type="submit" class="btn-primary">로그인</button>
      </form>

      <form id="signupForm">
        <input type="email" id="signupEmail" placeholder="이메일" required autocomplete="email">
        <input type="password" id="signupPw" placeholder="비밀번호 (6자 이상)" required autocomplete="new-password" minlength="6">
        <input type="password" id="signupPw2" placeholder="비밀번호 확인" required autocomplete="new-password" minlength="6">
        <button type="submit" class="btn-primary">가입 신청</button>
      </form>

      <div class="divider">또는</div>
      <button id="googleBtn" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.87-3.04.87-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.73A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.19.28-1.73V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.06l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        구글 계정으로 계속하기
      </button>

      <div id="msg"></div>
    </div>

    <!-- 승인 대기 / 로그인 후 상태 -->
    <div id="statusView" class="status-box">
      <div class="icon">⏳</div>
      <h2 id="statusTitle">승인 대기중입니다</h2>
      <p id="statusDesc">가입 신청이 접수되었습니다. 관리자 승인 후 이용하실 수 있습니다. 승인이 필요하시면 운영자에게 문의해주세요.</p>
      <button id="logoutBtn" class="btn-logout">로그아웃</button>
    </div>

  </div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp(window.firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var params = new URLSearchParams(location.search);
  var redirectTo = params.get("redirect") || "index.html";

  var authView = document.getElementById("authView");
  var statusView = document.getElementById("statusView");
  var msg = document.getElementById("msg");

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = type || "";
  }

  // 탭 전환
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      document.querySelectorAll("form").forEach(function (f) { f.classList.remove("active"); });
      tab.classList.add("active");
      document.getElementById(tab.dataset.tab + "Form").classList.add("active");
      showMsg("");
    });
  });

  // 이메일 로그인
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("loginEmail").value.trim();
    var pw = document.getElementById("loginPw").value;
    showMsg("로그인 중...", "info");
    auth.signInWithEmailAndPassword(email, pw).catch(function (err) {
      showMsg(friendlyError(err), "error");
    });
  });

  // 이메일 회원가입
  document.getElementById("signupForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("signupEmail").value.trim();
    var pw = document.getElementById("signupPw").value;
    var pw2 = document.getElementById("signupPw2").value;
    if (pw !== pw2) {
      showMsg("비밀번호가 일치하지 않습니다.", "error");
      return;
    }
    showMsg("가입 처리 중...", "info");
    auth.createUserWithEmailAndPassword(email, pw)
      .then(function (cred) {
        return createUserDoc(cred.user, "password");
      })
      .catch(function (err) {
        showMsg(friendlyError(err), "error");
      });
  });

  // 구글 로그인
  document.getElementById("googleBtn").addEventListener("click", function () {
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(function (result) {
        var isNew = result.additionalUserInfo && result.additionalUserInfo.isNewUser;
        if (isNew) {
          return createUserDoc(result.user, "google");
        }
      })
      .catch(function (err) {
        showMsg(friendlyError(err), "error");
      });
  });

  function createUserDoc(user, provider) {
    return db.collection("users").doc(user.uid).set({
      email: user.email,
      provider: provider,
      approved: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  document.getElementById("logoutBtn").addEventListener("click", function () {
    auth.signOut();
  });

  function friendlyError(err) {
    var map = {
      "auth/user-not-found": "존재하지 않는 계정입니다.",
      "auth/wrong-password": "비밀번호가 올바르지 않습니다.",
      "auth/email-already-in-use": "이미 가입된 이메일입니다. 로그인해주세요.",
      "auth/invalid-email": "이메일 형식이 올바르지 않습니다.",
      "auth/weak-password": "비밀번호는 6자 이상이어야 합니다.",
      "auth/popup-closed-by-user": "로그인 창이 닫혔습니다."
    };
    return map[err.code] || ("오류가 발생했습니다: " + err.message);
  }

  // 로그인 상태에 따라 화면 분기
  auth.onAuthStateChanged(function (user) {
    if (!user) {
      authView.style.display = "block";
      statusView.classList.remove("active");
      return;
    }

    db.collection("users").doc(user.uid).get().then(function (doc) {
      if (doc.exists && doc.data().approved === true) {
        location.replace(redirectTo);
      } else {
        authView.style.display = "none";
        statusView.classList.add("active");
      }
    });
  });
</script>
</body>
</html>
